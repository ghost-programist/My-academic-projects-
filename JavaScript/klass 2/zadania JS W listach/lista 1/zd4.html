<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadane 4</title>
</head>
<body>
    <button id="btn" onclick="math()">Zmień kolor</button>
    <script> 
        let btn = document.getElementById("btn")
        
        
       
            
            function math(){
                let col = ["red", "green", "blue", "yellow"] 
                let x = Math.floor(Math.random() * 4)
                document.body.style.backgroundColor = col[x]
            }
  
    </script>
</body>
</html>
